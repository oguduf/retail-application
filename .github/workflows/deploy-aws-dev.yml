name: Build and deploy Coffee Store to EKS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: coffee-store-aws-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT }}
  ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
  EVENT_BUS_NAME: ${{ vars.ORDER_EVENT_BUS_NAME }}
  ORDER_NOTIFICATION_QUEUE_URL: ${{ vars.ORDER_NOTIFICATION_QUEUE_URL }}
  ORDER_NOTIFICATION_TOPIC_ARN: ${{ vars.ORDER_NOTIFICATION_TOPIC_ARN }}
  ORDER_SERVICE_ROLE_ARN: ${{ vars.ORDER_SERVICE_ROLE_ARN }}
  NOTIFICATION_SERVICE_ROLE_ARN: ${{ vars.NOTIFICATION_SERVICE_ROLE_ARN }}
  # Include the workflow run ID so a fresh dispatch of the same commit gets a new immutable ECR tag.
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in AWS_REGION AWS_ROLE_ARN EKS_CLUSTER_NAME PROJECT_NAME ENVIRONMENT ACM_CERTIFICATE_ARN DOMAIN_NAME EVENT_BUS_NAME ORDER_NOTIFICATION_QUEUE_URL ORDER_NOTIFICATION_TOPIC_ARN ORDER_SERVICE_ROLE_ARN NOTIFICATION_SERVICE_ROLE_ARN; do
            if [ -z "${!name}" ]; then
              echo "Missing repository variable: $name" >&2
              exit 1
            fi
          done

      - name: Run product catalog tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/product/requirements-dev.txt

      - name: Install test dependencies and run tests
        working-directory: services/product
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pytest --quiet

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: RoastRelayCoffeeStoreDeploy

      - name: Set up Trivy for image scans
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Build and scan all five application images
        shell: bash
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          for service in product inventory order notification frontend; do
            case "$service" in
              product) directory=services/product ;;
              inventory) directory=services/inventory ;;
              order) directory=services/orders ;;
              notification) directory=services/notifications ;;
              frontend) directory=frontend ;;
            esac
            image="${registry}/${PROJECT_NAME}-${ENVIRONMENT}-${service}:${IMAGE_TAG}"
            docker build --tag "$image" "$directory"
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
          echo "ECR_REGISTRY=$registry" >> "$GITHUB_ENV"

      - name: Push scanned application images
        shell: bash
        run: |
          for service in product inventory order notification frontend; do
            repository="${PROJECT_NAME}-${ENVIRONMENT}-${service}"
            image="${ECR_REGISTRY}/${repository}:${IMAGE_TAG}"
            push_output="$(docker push "$image" 2>&1)"
            printf '%s\n' "$push_output"
            digest="$(printf '%s\n' "$push_output" | grep -oE 'sha256:[0-9a-f]{64}' | tail -n 1)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Could not read the pushed image digest for $repository" >&2
              exit 1
            fi
            case "$service" in
              product) image_variable=PRODUCT_IMAGE_REF ;;
              inventory) image_variable=INVENTORY_IMAGE_REF ;;
              order) image_variable=ORDER_IMAGE_REF ;;
              notification) image_variable=NOTIFICATION_IMAGE_REF ;;
              frontend) image_variable=FRONTEND_IMAGE_REF ;;
            esac
            printf '%s=%s\n' "$image_variable" "${ECR_REGISTRY}/${repository}@${digest}" >> "$GITHUB_ENV"
          done

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.36.1

      - name: Connect to Amazon EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Apply AWS storage and application manifests
        shell: bash
        run: |
          kubectl apply -f k8s/aws/00-namespace.yaml
          kubectl apply -f k8s/aws/10-storage.yaml
          python3 - <<'PY' | kubectl apply -f -
          import os
          from pathlib import Path

          replacements = {
              "PRODUCT_IMAGE_PLACEHOLDER": os.environ["PRODUCT_IMAGE_REF"],
              "INVENTORY_IMAGE_PLACEHOLDER": os.environ["INVENTORY_IMAGE_REF"],
              "ORDER_IMAGE_PLACEHOLDER": os.environ["ORDER_IMAGE_REF"],
              "NOTIFICATION_IMAGE_PLACEHOLDER": os.environ["NOTIFICATION_IMAGE_REF"],
              "FRONTEND_IMAGE_PLACEHOLDER": os.environ["FRONTEND_IMAGE_REF"],
              "ORDER_SERVICE_ROLE_ARN_PLACEHOLDER": os.environ["ORDER_SERVICE_ROLE_ARN"],
              "NOTIFICATION_SERVICE_ROLE_ARN_PLACEHOLDER": os.environ["NOTIFICATION_SERVICE_ROLE_ARN"],
              "EVENT_BUS_NAME_PLACEHOLDER": os.environ["EVENT_BUS_NAME"],
              "ORDER_NOTIFICATION_QUEUE_URL_PLACEHOLDER": os.environ["ORDER_NOTIFICATION_QUEUE_URL"],
              "ORDER_NOTIFICATION_TOPIC_ARN_PLACEHOLDER": os.environ["ORDER_NOTIFICATION_TOPIC_ARN"],
          }
          manifest = Path("k8s/aws/20-application.yaml.tpl").read_text()
          for placeholder, value in replacements.items():
              manifest = manifest.replace(placeholder, value)
          print(manifest)
          PY
          python3 - <<'PY' | kubectl apply -f -
          import os
          from pathlib import Path

          manifest = Path("k8s/aws/30-ingress.yaml").read_text()
          manifest = manifest.replace("ACM_CERTIFICATE_ARN_PLACEHOLDER", os.environ["ACM_CERTIFICATE_ARN"])
          manifest = manifest.replace("DOMAIN_NAME_PLACEHOLDER", os.environ["DOMAIN_NAME"])
          print(manifest)
          PY

      - name: Verify application rollouts
        shell: bash
        run: |
          for deployment in product-service inventory-service order-service notification-service frontend; do
            kubectl rollout status "deployment/${deployment}" --namespace coffee-store --timeout=5m
          done
          kubectl get pods,services,ingress --namespace coffee-store
