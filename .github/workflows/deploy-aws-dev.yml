name: Configure Coffee Store Argo CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coffee-store-aws-dev
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the dev branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/dev" ]]; then
            echo "::error::Select the dev branch when dispatching this deployment."
            exit 1
          fi

      - name: Check out application repository
        uses: actions/checkout@v6

      - name: Validate published Git image references
        shell: bash
        run: |
          set -euo pipefail
          source_revision="$(jq -er '.sourceRevision' helm/coffee-store/images.json)"
          if [[ ! "$source_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::No CI-published image revision is recorded in helm/coffee-store/images.json. Push to dev and wait for CI image publishing to finish first."
            exit 1
          fi
          jq -e '
            [.services["product-service"].image,
             .services["inventory-service"].image,
             .services["order-service"].image,
             .services["order-outbox-relay"].image,
             .services["notification-service"].image,
             .services.frontend.image]
            | all(.[]; test("@sha256:[0-9a-f]{64}$"))
          ' helm/coffee-store/images.json >/dev/null
          echo "SOURCE_REVISION=$source_revision" >> "$GITHUB_ENV"

      - name: Require successful CI and security checks for the published source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in ci.yml security.yml; do
            if ! gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" --commit "$SOURCE_REVISION" \
              --event push --status success \
              --json headSha,conclusion --limit 100 |
              jq -e --arg sha "$SOURCE_REVISION" 'any(.[]; .headSha == $sha and .conclusion == "success")' >/dev/null; then
              echo "::error::No successful push run of $workflow was found for source revision $SOURCE_REVISION."
              exit 1
            fi
          done

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      ENVIRONMENT: ${{ vars.ENVIRONMENT }}
      ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
      DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
      EVENT_BUS_NAME: ${{ vars.ORDER_EVENT_BUS_NAME }}
      ORDER_NOTIFICATION_QUEUE_URL: ${{ vars.ORDER_NOTIFICATION_QUEUE_URL }}
      ORDER_NOTIFICATION_TOPIC_ARN: ${{ vars.ORDER_NOTIFICATION_TOPIC_ARN }}
      ORDER_SERVICE_ROLE_ARN: ${{ vars.ORDER_SERVICE_ROLE_ARN }}
      ORDER_DB_MIGRATOR_ROLE_ARN: ${{ vars.ORDER_DB_MIGRATOR_ROLE_ARN }}
      INVENTORY_SERVICE_ROLE_ARN: ${{ vars.INVENTORY_SERVICE_ROLE_ARN }}
      NOTIFICATION_SERVICE_ROLE_ARN: ${{ vars.NOTIFICATION_SERVICE_ROLE_ARN }}
      ORDERS_DATABASE_HOST: ${{ vars.ORDERS_DATABASE_HOST }}
      ORDERS_DATABASE_SECRET_ARN: ${{ vars.ORDERS_DATABASE_SECRET_ARN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out application repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in AWS_REGION AWS_ROLE_ARN EKS_CLUSTER_NAME PROJECT_NAME ENVIRONMENT ACM_CERTIFICATE_ARN DOMAIN_NAME EVENT_BUS_NAME ORDER_NOTIFICATION_QUEUE_URL ORDER_NOTIFICATION_TOPIC_ARN ORDER_SERVICE_ROLE_ARN ORDER_DB_MIGRATOR_ROLE_ARN INVENTORY_SERVICE_ROLE_ARN NOTIFICATION_SERVICE_ROLE_ARN ORDERS_DATABASE_HOST ORDERS_DATABASE_SECRET_ARN; do
            if [ -z "${!name}" ]; then
              echo "Missing repository variable: $name" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: RoastRelayCoffeeStoreDeploy

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1

      - name: Connect to Amazon EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Configure Coffee Store for Argo CD auto-sync
        shell: bash
        run: |
          set -euo pipefail

          application="$(jq -n \
            --arg project "$PROJECT_NAME" \
            --arg environment "$ENVIRONMENT" \
            --arg awsRegion "$AWS_REGION" \
            --arg domainName "$DOMAIN_NAME" \
            --arg certificateArn "$ACM_CERTIFICATE_ARN" \
            --arg orderRoleArn "$ORDER_SERVICE_ROLE_ARN" \
            --arg orderMigratorRoleArn "$ORDER_DB_MIGRATOR_ROLE_ARN" \
            --arg inventoryRoleArn "$INVENTORY_SERVICE_ROLE_ARN" \
            --arg notificationRoleArn "$NOTIFICATION_SERVICE_ROLE_ARN" \
            --arg ordersDatabaseHost "$ORDERS_DATABASE_HOST" \
            --arg ordersDatabaseSecretArn "$ORDERS_DATABASE_SECRET_ARN" \
            --arg eventBusName "$EVENT_BUS_NAME" \
            --arg notificationQueueUrl "$ORDER_NOTIFICATION_QUEUE_URL" \
            --arg notificationTopicArn "$ORDER_NOTIFICATION_TOPIC_ARN" \
            '{
              apiVersion: "argoproj.io/v1alpha1",
              kind: "Application",
              metadata: {name: "coffee-store", namespace: "argocd"},
              spec: {
                project: "default",
                source: {
                  repoURL: "https://github.com/oguduf/retail-application.git",
                  targetRevision: "dev",
                  path: "helm/coffee-store",
                  helm: {
                    releaseName: "coffee-store",
                    valueFiles: ["images.json"],
                    valuesObject: {
                      project: $project,
                      environment: $environment,
                      awsRegion: $awsRegion,
                      domainName: $domainName,
                      certificateArn: $certificateArn,
                      serviceAccounts: {
                        orderRoleArn: $orderRoleArn,
                        orderMigratorRoleArn: $orderMigratorRoleArn,
                        inventoryRoleArn: $inventoryRoleArn,
                        notificationRoleArn: $notificationRoleArn
                      },
                      orders: {
                        databaseHost: $ordersDatabaseHost,
                        databaseName: "orders",
                        databaseSecretArn: $ordersDatabaseSecretArn,
                        eventBusName: $eventBusName
                      },
                      database: {host: $ordersDatabaseHost, name: "orders"},
                      notifications: {
                        queueUrl: $notificationQueueUrl,
                        topicArn: $notificationTopicArn
                      }
                    }
                  }
                },
                destination: {
                  server: "https://kubernetes.default.svc",
                  namespace: "coffee-store"
                },
                ignoreDifferences: [{
                  group: "apps",
                  kind: "Deployment",
                  namespace: "coffee-store",
                  jsonPointers: ["/spec/replicas"]
                }, {
                  group: "*",
                  kind: "*",
                  namespace: "coffee-store",
                  jsonPointers: ["/metadata/annotations/argocd.argoproj.io~1tracking-id"]
                }],
                syncPolicy: {
                  automated: {enabled: true, selfHeal: true, prune: false},
                  syncOptions: ["CreateNamespace=true", "RespectIgnoreDifferences=true"]
                }
              }
            }')"

          printf '%s\n' "$application" | kubectl apply --filename -
          kubectl wait --for=jsonpath='{.status.sync.status}'=Synced \
            application/coffee-store --namespace argocd --timeout=10m
          kubectl wait --for=jsonpath='{.status.health.status}'=Healthy \
            application/coffee-store --namespace argocd --timeout=10m

      - name: Verify Argo CD-managed application rollouts
        shell: bash
        run: |
          for deployment in product-service inventory-service order-service order-outbox-relay notification-service frontend; do
            kubectl rollout status "deployment/${deployment}" --namespace coffee-store --timeout=5m
          done
          kubectl get pods,services,ingress,hpa,vpa --namespace coffee-store

      - name: Smoke-test the deployed application through the frontend
        shell: bash
        run: |
          set -euo pipefail
          kubectl port-forward --namespace coffee-store service/frontend 18080:80 >/tmp/coffee-store-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/health >/dev/null
          for endpoint in catalog inventory orders notifications; do
            curl --fail --silent --show-error "http://127.0.0.1:18080/api/${endpoint}" >/dev/null
            echo "Frontend route /api/${endpoint} responded successfully"
          done
