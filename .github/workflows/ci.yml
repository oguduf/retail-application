name: Coffee Store CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/product/requirements-dev.txt

      - name: Run product catalog tests
        working-directory: services/product
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pytest --quiet

      - name: Run order storage tests
        working-directory: services/orders
        run: |
          python -m pip install --requirement requirements.txt pytest
          python -m pytest --quiet test_database.py

      - name: Run inventory storage tests
        working-directory: services/inventory
        run: |
          python -m pip install --requirement requirements.txt pytest httpx==0.28.1
          python -m pytest --quiet test_storage.py

      - name: Run notification storage tests
        working-directory: services/notifications
        run: |
          python -m pip install --requirement requirements.txt pytest httpx==0.28.1
          python -m pytest --quiet test_storage.py

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0

      - name: Lint and render the application chart
        run: |
          helm lint helm/coffee-store --strict
          helm template coffee-store helm/coffee-store --namespace coffee-store > /tmp/coffee-store-rendered.yaml

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application repository
        uses: actions/checkout@v6

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - name: Build and scan all five application images
        shell: bash
        run: |
          set -euo pipefail
          for service in product inventory order notification frontend; do
            case "$service" in
              product) directory=services/product ;;
              inventory) directory=services/inventory ;;
              order) directory=services/orders ;;
              notification) directory=services/notifications ;;
              frontend) directory=frontend ;;
            esac
            image="coffee-store-ci-${service}:${GITHUB_SHA}"
            docker build --tag "$image" "$directory"
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
