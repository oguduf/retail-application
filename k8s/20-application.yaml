apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: coffee-store
  annotations:
    checkov.io/skip1: "CKV_K8S_15=Local kind preloads dev images so Never is required; AWS manifest sets Always"
    checkov.io/skip2: "CKV_K8S_43=This manifest is for local kind with preloaded dev tags; AWS deployment uses pushed ECR digests"
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: coffee-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: product-service
          image: retail-application-product-service:dev
          imagePullPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
