server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/catalog {
        proxy_pass http://product-service:8000/products;
        proxy_set_header Host $host;
    }

    location /api/inventory {
        proxy_pass http://inventory-service:8000/inventory;
        proxy_set_header Host $host;
    }

    location /api/orders {
        proxy_pass http://order-service:8000/orders;
        proxy_set_header Host $host;
    }

    location /api/notifications {
        proxy_pass http://notification-service:8000/notifications;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
